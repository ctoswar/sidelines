name: Feature request
description: Suggest an idea or improvement for Sidelines
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected and what is painful today?
      placeholder: Organizers can't see which fields are free when generating a schedule…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Event pages / public site
        - Player dashboard
        - Organizer dashboard
        - Scoring
        - Auth / accounts
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context
